<!DOCTYPE html>
<html>
<head>
    <title>ConnectProtect</title>
    <style>
        body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; }
        h2 { margin-top: 0; color: #2c3e50; display: flex; align-items: center; gap: 10px; }
        
        /* Container for the input */
        .input-container { margin-bottom: 15px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Action Buttons (Save/Cancel) hidden by default */
        .action-btns {
            display: none; /* Hidden initially */
            margin-top: 5px;
            justify-content: flex-end;
            gap: 5px;
        }
        
        button { cursor: pointer; padding: 8px 12px; border: none; border-radius: 4px; }
        .btn-save { background: #27ae60; color: white; }
        .btn-cancel { background: #e74c3c; color: white; }
        .btn-remove { background: #e74c3c; color: white; padding: 2px 8px; font-size: 12px; margin-left: auto;}

        /* List Styles */
        ul { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; border-top: 1px solid #eee;}
        li { 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 13px;
        }
        li:hover { background-color: #f9f9f9; }
        
        .empty-msg { text-align: center; color: #888; font-style: italic; margin-top: 20px;}
    </style>
</head>
<body>

    <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#2c3e50">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        ConnectProtect
    </h2>

    <div class="input-container">
        <input type="text" id="urlInput" placeholder="Add a link to block...">
        <div class="action-btns" id="actionBtns">
            <button class="btn-cancel" id="cancelBtn">Cancel</button>
            <button class="btn-save" id="saveBtn">Save</button>
        </div>
    </div>

    <h3>Blocked Links</h3>
    <ul id="linkList"></ul>
    <div id="emptyMsg" class="empty-msg">No blocked links yet.</div>

    <script src="popup.js"></script>
</body>
</html>
