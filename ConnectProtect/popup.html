<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ConnectProtect — Phishing Shield</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo-shield">🛡️</div>
        <h2>ConnectProtect</h2>
        <span class="badge">Edge-AI Active</span>
    </div>

    <!-- STATS -->
    <div class="stats-container">
        <div class="stat-box blue">
            <span class="stat-number" id="scanCount">0</span>
            <span class="stat-label">Scanned</span>
        </div>
        <div class="stat-box green">
            <span class="stat-number" id="whiteCount">0</span>
            <span class="stat-label">Whitelisted</span>
        </div>
        <div class="stat-box danger">
            <span class="stat-number" id="blockCount">0</span>
            <span class="stat-label">Blocked</span>
        </div>
    </div>

    <!-- SCAN CONTROLS -->
    <div class="controls">
        <input type="text" id="urlInput" placeholder="Paste a URL to scan…" autocomplete="off" spellcheck="false">
        <button id="scanBtn" class="primary-btn">🔍 Scan URL</button>

        <!-- Post-scan quick-add buttons -->
        <div class="btn-row scan-action-row" id="scanActionRow" style="display:none;">
            <button id="whitelistScannedBtn" class="success-btn scan-action-btn">
                <span>✅ Whitelist<br>Scanned URL</span>
            </button>
            <button id="blocklistScannedBtn" class="danger-btn scan-action-btn">
                <span>🚫 Blocklist<br>Scanned URL</span>
            </button>
        </div>

        <div class="btn-row">
            <button id="viewWhitelistBtn" class="success-btn">Whitelist</button>
            <button id="viewBlocklistBtn" class="danger-btn">Blocklist</button>
        </div>
    </div>

    <!-- SCAN RESULT -->
    <div id="scanResult" style="display:none;"></div>

    <!-- LIST MODAL -->
    <div id="listModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle">List</h3>
            <ul id="urlList"></ul>
            <div class="modal-actions">
                <button id="removeAllBtn" class="danger-btn">Remove All</button>
                <button id="removeSelectedBtn" class="danger-btn-outline" style="display: none;">Remove</button>
                <button id="closeModalBtn" class="secondary-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- CONFIRM MODAL -->
    <div id="confirmModal" class="modal-overlay confirm-overlay">
        <div class="modal-content">
            <p>Are you sure you want to remove all entries from this list?</p>
            <div class="modal-actions">
                <button id="confirmYesBtn" class="danger-btn">Yes, Remove All</button>
                <button id="confirmCancelBtn" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts: engine MUST load before popup.js -->
    <script src="engine.js"></script>
    <script src="popup.js"></script>
</body>
</html>
